version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
      - "/test/NitroTestKit"
      - "/examples/mnist"
    schedule:
      interval: "weekly"
    # Stdlib versions are fixed by the `julia` compat entry.
    ignore:
      - dependency-name: "Dates"
      - dependency-name: "LinearAlgebra"
      - dependency-name: "Logging"
      - dependency-name: "Printf"
      - dependency-name: "Random"
      - dependency-name: "SHA"
      - dependency-name: "UUIDs"
