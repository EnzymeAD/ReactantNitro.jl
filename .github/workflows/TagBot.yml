name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    # The repo default workflow token is read-only, so without this block TagBot
    # cannot push the tag or create the GitHub release. contents: write does both;
    # issues: write lets TagBot open a "manual intervention" issue if release
    # creation ever fails.
    permissions:
      contents: write
      issues: write
    steps:
      - uses: JuliaRegistries/TagBot@a3a48fad3c1d6c2abbb874970a3f9032493a7473 # v1.25.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
