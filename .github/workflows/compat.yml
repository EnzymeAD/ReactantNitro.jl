# Does the next Julia release still work? `[compat] julia = "1.12"` is a caret
# bound, so it already ADMITS 1.13, and nothing in CI currently backs that
# claim. This workflow is what backs it.
#
# It is deliberately NOT part of ci.yml, and the reason is compute rather than
# tidiness. Runner capacity is shared and contended, so a job that runs on every
# push and every PR is paid for in queue time on the path a reviewer is waiting
# on. The signal here does not justify that: whether 1.13 works is gated on
# Reactant and Enzyme picking up a new Julia minor, which moves on a scale of
# weeks, so sampling it per commit measures the same answer over and over.
# Weekly, plus on demand before a release, is the same information for a
# fraction of the contention.
#
# Nothing here reaches the README: the CI badge points at ci.yml, which runs
# 1.12 only, so a red run here is a note to the maintainer and never a claim
# about the supported version.
#
# When 1.13 goes green and stays green, the move is to add it to ci.yml's matrix
# and delete this file, not to keep both.
name: Compat

on:
  schedule:
    # Mondays, 06:37 UTC. Off the hour on purpose: scheduled workflows all fire
    # into the same queue, and the top of the hour is the worst of it.
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} (advisory)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The NEXT release, not the supported one. ci.yml owns 1.12.
        version: ['1.13']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          # Kept in step with ci.yml: same worker count, same retry budget, so a
          # failure here is a Julia-version difference and not a load difference.
          RETESTITEMS_NWORKERS: 2
          RETESTITEMS_RETRIES: 2
