name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - 'examples/**'
      - 'scripts/**'
      - '.claude-plugin/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/workflows/format.yml'
      - '.github/workflows/TagBot.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - 'examples/**'
      - 'scripts/**'
      - '.claude-plugin/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/workflows/format.yml'
      - '.github/workflows/TagBot.yml'

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1.13']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1.12' }}
        env:
          RETESTITEMS_NWORKERS: 2
          RETESTITEMS_RETRIES: 2
          RETESTITEMS_TIMEOUT_PROFILE_WAIT: 30
          RETESTITEMS_TESTITEM_TIMEOUT: 1200
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
