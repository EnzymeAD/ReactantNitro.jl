# Runic formatting check: every .jl file in the repo must be Runic-formatted. Run
# `runic --inplace src ext test docs` locally (see CLAUDE.md) and commit the result;
# this check fails with a diff until the whole tree is formatted.
name: Format

# An ALLOWLIST here, unlike CI's denylist, because the rule this job enforces is
# itself about one file type: Runic formats `.jl` and nothing else, so a change
# that adds no Julia cannot break the check. `**/*.jl` is every tracked Julia
# file at any depth, which is a superset of the `src ext test docs` the local
# hook formats. Repeated for push and pull_request: the workflow parser does not
# resolve YAML anchors.
on:
  push:
    branches: [main]
    paths:
      - '**/*.jl'
      - '.github/workflows/format.yml'
  pull_request:
    paths:
      - '**/*.jl'
      - '.github/workflows/format.yml'

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

# actions: write is needed because julia-actions/cache prunes its own old caches.
permissions:
  contents: read
  actions: write

jobs:
  runic:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: fredrikekre/runic-action@v1
        with:
          # Keep in sync with the local `runic` CLI:
          #   julia -e 'using Pkg; Pkg.Apps.add("Runic")'
          version: '1.10'
