# The example environment, self contained. `ReactantNitro` comes from the repository root through
# `[sources]` rather than from the registry, so the example runs against the tree it sits in.
#
#     julia --project=examples -e 'using Pkg; Pkg.instantiate()'
#     julia --project=examples examples/mnist_tutorial.jl
#
# None of MLDatasets, MLUtils or ParameterSchedulers is a ReactantNitro dependency, and that is the
# point the tutorial makes about each of them: the framework ships no data loading, no batching and
# no schedule library, so an example needs them and the package does not.
[deps]
Lux = "b2108857-7c20-44ae-9111-449ecde12c47"
MLDatasets = "eb30cadb-4394-5ae3-aed4-317e484a6458"
MLUtils = "f1d291b0-491e-4a28-83b9-f70985020b54"
Optimisers = "3bd65402-5787-11e9-1adc-39752487f4e2"
ParameterSchedulers = "d7d3b36b-41b8-4d0d-a2bf-768c6151755e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
ReactantNitro = "641982cc-88f5-4d80-bec4-e68c6a8af0a5"

[sources]
ReactantNitro = {path = ".."}
